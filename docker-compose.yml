services:
  backend:
    build: ./backend
    container_name: shopdoctor-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./shopdoctor.db
      - LLM_PROVIDER=mock
      - CORS_ORIGINS=http://localhost:5173,http://localhost:8080
    volumes:
      - shopdoctor-data:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: shopdoctor-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  shopdoctor-data:
